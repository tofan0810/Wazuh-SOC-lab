<!--
  Wazuh Agent Configuration for Windows 10 Endpoint
  Target Host: 192.168.71.129
  Manager Host: 192.168.71.128
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.71.128</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows10</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- Realtime File Integrity Monitoring (FIM / Syscheck) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Monitor Canary Honey-Files and Public Directory in Realtime -->
    <directories realtime="yes" check_all="yes">C:\Users\Public</directories>
    <directories check_all="yes">C:\Windows\System32\drivers\etc</directories>
    
    <!-- Windows Registry Integrity Monitoring -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry>HKEY_CURRENT_USER\Software\Classes\ms-settings</windows_registry>
  </syscheck>

  <!-- Log Collection: Windows Event Channels & Apache -->
  <!-- Microsoft Sysmon Telemetry (Event IDs 1, 3, 10, 11, 12, 13) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Security Logs (Event IDs 4624, 4625, 4663 SACL) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows System Logs -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Application Logs -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Apache Web Server Access Log (XAMPP LFI Scenario) -->
  <localfile>
    <location>C:\xampp\apache\logs\access.log</location>
    <log_format>apache</log_format>
  </localfile>

  <!-- Active Response Configuration -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>wpk_root.pem</ca_store>
    <ca_verification>no</ca_verification>
  </active-response>
</ossec_config>
